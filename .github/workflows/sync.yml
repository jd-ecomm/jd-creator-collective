name: Jotform sync

on:
  schedule:
    - cron: "7 * * * *"     # safety net only. Each run stays up ~5.5 hours syncing on a steady rhythm, then starts the next run itself
  workflow_dispatch: {}      # "Run workflow" button for an on-demand refresh
  push:                      # also runs when the sync code itself changes
    branches: [main]
    paths: ["sync/**", ".github/workflows/sync.yml"]

env:
  LAUNCH_DAY: "2026-10-21"   # Vancouver date: sync every LAUNCH_INTERVAL_MIN minutes all day
  LAUNCH_INTERVAL_MIN: "3"
  DAY_INTERVAL_MIN: "15"     # other days: every 15 minutes 7am to 10pm Vancouver, hourly overnight
  LOOP_MINUTES: "330"        # how long one run stays up. "Refresh now" in the CRM is picked up within ~15 seconds

# One sync at a time. A code change (push) replaces the running loop; anything else queues behind it.
concurrency:
  group: jotform-sync
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  actions: write   # lets each run start the next one, so syncing never depends on GitHub's scheduler

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node sync.mjs
        env:
          JOTFORM_API_KEY: ${{ secrets.JOTFORM_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_OEMBED_TOKEN: ${{ secrets.META_OEMBED_TOKEN }}
          JOTFORM_FORM_ID: ${{ vars.JOTFORM_FORM_ID || '262455225676261' }}
          JOTFORM_UTC_OFFSET: ${{ vars.JOTFORM_UTC_OFFSET || '-04:00' }}
      - name: Start the next run
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync.yml --ref main
