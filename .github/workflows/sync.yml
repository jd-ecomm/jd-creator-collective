name: Jotform sync

on:
  schedule:
    - cron: "7 * * * *"     # hourly, at 7 minutes past
    - cron: "*/5 * * * *"   # every 5 minutes, but only acts on LAUNCH_DAY below (launch-day boost)
  workflow_dispatch: {}      # "Run workflow" button for an on-demand refresh
  push:                      # also runs when the sync code itself changes
    branches: [main]
    paths: ["sync/**", ".github/workflows/sync.yml"]

env:
  LAUNCH_DAY: "2026-10-21"   # Vancouver date for 5-minute syncs. Other days, the 5-minute schedule does nothing.

concurrency:
  group: jotform-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sync
    steps:
      - name: Decide whether to run
        id: gate
        working-directory: .
        run: |
          today=$(TZ=America/Vancouver date +%F)
          if [ "${{ github.event.schedule }}" = "*/5 * * * *" ] && [ "$today" != "$LAUNCH_DAY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "5-minute schedule is only active on $LAUNCH_DAY (today is $today). Skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        if: steps.gate.outputs.run == 'true'
      - run: node sync.mjs
        if: steps.gate.outputs.run == 'true'
        env:
          JOTFORM_API_KEY: ${{ secrets.JOTFORM_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_OEMBED_TOKEN: ${{ secrets.META_OEMBED_TOKEN }}
          JOTFORM_FORM_ID: ${{ vars.JOTFORM_FORM_ID || '262455225676261' }}
          JOTFORM_UTC_OFFSET: ${{ vars.JOTFORM_UTC_OFFSET || '-04:00' }}
